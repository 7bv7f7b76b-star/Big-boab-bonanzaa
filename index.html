<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Big Boab Bonanza</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#160d08;color:#fff;font-family:Arial,Helvetica,sans-serif}body{background:radial-gradient(circle at 50% 0,#5b2a18,#2a1510 38%,#100907);overflow-x:hidden}.tartan{height:18px;background:repeating-linear-gradient(90deg,#7e111a 0 24px,#1d253c 24px 42px,#d1a335 42px 48px,#1d253c 48px 72px);border-top:3px solid #b58a48;border-bottom:3px solid #3a2112}.version{position:fixed;left:10px;top:10px;z-index:30;background:#9d111b;border:3px solid #f0c76c;border-radius:10px;padding:6px 9px;font:900 11px Arial}.machine{width:min(1180px,100%);margin:auto;padding:18px 12px 110px}.header{display:grid;grid-template-columns:210px 1fr 250px;gap:14px;align-items:end}.hero{background:#21130d;border:5px solid #7b4b25;border-radius:18px;padding:9px;text-align:center}.hero img{width:100%;aspect-ratio:1;object-fit:cover;object-position:50% 17%;border-radius:12px;border:3px solid #d5a553}.chalk{margin-top:8px;background:#15221a;border:5px solid #6a4324;padding:9px;font:900 23px Georgia}.logo{text-align:center;text-shadow:0 5px #2a0b05,0 9px #000}.big{font:900 clamp(46px,7vw,92px) Georgia;color:#f2c151}.boabword{font:900 clamp(54px,8vw,105px) Georgia;color:#d6d0c5;-webkit-text-stroke:3px #41372f;line-height:.72}.bonanza{display:inline-block;margin-top:10px;padding:7px 25px;background:#174c29;border:5px solid #7b4b25;border-radius:12px;color:#f4c75a;font:900 clamp(32px,5vw,58px) Georgia}.board{background:#321b10;border:5px solid #120904;border-radius:12px;padding:15px;text-align:center;font-weight:900;color:#ffe8b4}.panel{margin-top:12px;border:5px solid #6d4324;background:#6b0e17;padding:10px;text-align:center;font-weight:900}.cabinet{margin-top:14px;background:#3b2113;border:7px solid #110806;border-radius:18px;padding:12px;box-shadow:inset 0 0 0 3px #a16837}.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;background:#06111a;border:4px solid #05070a;padding:6px;min-height:300px}.cell{aspect-ratio:1;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;background:linear-gradient(#17364b,#07121c);border:2px solid #52718a;font-size:clamp(26px,5vw,60px);font-weight:900}.cell.scatter{border:4px solid #ffd45c;background-color:#221205;background-image:url('boab-face.jpg?v=face-only-2');background-repeat:no-repeat;background-size:245% auto;background-position:50% 12%;box-shadow:inset 0 0 16px #ffd45c99,0 0 8px #ffd45c88}.cell.scatter:after{content:"";position:absolute;inset:3px;border:2px solid #ffe9a4;border-radius:10px;pointer-events:none}.cell.drop{animation:drop .5s both;animation-delay:var(--d)}@keyframes drop{0%{transform:translateY(-230%);opacity:.05}100%{transform:none;opacity:1}}.cell.win{outline:4px solid #ffd34e;filter:brightness(1.4)}.cell.vanish{animation:vanish .27s both}@keyframes vanish{to{transform:scale(.1);opacity:0}}.badge{position:absolute;right:2px;top:2px;background:#b71924;border:2px solid #ffe29a;border-radius:20px;padding:2px 5px;font:900 12px Arial;z-index:3}.msg{height:46px;display:flex;align-items:center;justify-content:center;background:#190d08;color:#ffd36b;font-weight:900;text-align:center}.footer{position:fixed;left:0;right:0;bottom:0;z-index:20;background:#2b180e;border-top:5px solid #7a4a29;display:grid;grid-template-columns:90px 1fr 1fr 110px 1fr 1fr 90px;gap:8px;align-items:center;padding:8px 12px}.stat{text-align:center}.stat span{display:block;font-size:11px}.stat b{font-size:23px}.btn{background:#5b351d;color:#fff;border:3px solid #1c0d06;border-radius:10px;padding:11px;font-weight:900}.spin{width:86px;height:86px;border-radius:50%;border:6px solid #47200d;background:#15923c;color:#fff;font-size:38px}.sound{position:fixed;right:10px;top:10px;z-index:31}.overlay{position:fixed;inset:0;background:#050203e8;z-index:50;display:none;align-items:center;justify-content:center}.overlay.show{display:flex}.winbox{text-align:center}.winTitle{font:900 clamp(62px,15vw,130px) Georgia;color:#ffd04f}.winAmt{font-size:60px;color:#6eff83}@media(max-width:820px){.machine{padding:8px 7px 100px}.header{display:block}.hero,.board{display:none}.logo{padding-top:32px}.big{font-size:45px}.boabword{font-size:58px}.bonanza{font-size:32px}.cabinet{padding:7px}.grid{gap:3px;padding:3px;min-height:330px}.cell{font-size:9vw}.cell.scatter{background-size:285% auto;background-position:50% 10%;border-width:3px}.footer{grid-template-columns:1fr 1fr 72px 1fr}.hideMobile{display:none}.spin{width:68px;height:68px}.version{font-size:9px}}</style></head><body><div class="version">FACE TILE BUILD</div><button id="sound" class="sound">🔊</button><div class="tartan"></div><main class="machine"><section class="header"><div class="hero"><img src="boab-face.jpg?v=hero2"><div class="chalk">5 TEETH CLUB</div></div><div class="logo"><div class="big">BIG</div><div class="boabword">BOAB</div><div class="bonanza">BONANZA</div><div style="font-size:28px;margin:10px">🍺 🥃 🏴 🎯 🍟</div></div><div class="board">4+ BOABS = +10 FREE SPINS<br><br>BOAB BOMB MULTIPLIES WINS</div></section><div class="panel">THE CLAN BAR • BIG BOAB'S LOCAL • FREE SPINS AFTER FOUR BOABS</div><section class="cabinet"><div id="grid" class="grid"></div><div id="msg" class="msg">Boab's at the bar. Hit SPIN.</div></section></main><footer class="footer"><button id="reset" class="btn hideMobile">RESET</button><div class="stat"><span>BALANCE</span><b id="bal">£100.00</b></div><div class="stat"><span>BET</span><b id="betv">£1.00</b></div><button id="down" class="btn">−</button><button id="spin" class="spin">↻</button><button id="up" class="btn">+</button><div class="stat hideMobile"><span>FREE</span><b id="fs">0</b></div></footer><div id="bigwin" class="overlay"><div class="winbox"><div class="winTitle">BIG BOAB!</div><div id="bigamount" class="winAmt"></div><div id="bigmult"></div><button id="continueBtn" class="btn">BACK TO BAR</button></div></div><script>(()=>{'use strict';const S=['🍺','🥃','📱','💨','🍟','🎯','🏴','🦷'],M=[2,3,5,10,25,50,100];let balance=100,wager=1,free=0,busy=false,board=[],soundOn=true,audio=null;const $=s=>document.querySelector(s),g=$('#grid'),msg=$('#msg'),spin=$('#spin'),bal=$('#bal'),betv=$('#betv'),fs=$('#fs'),down=$('#down'),up=$('#up'),reset=$('#reset'),sound=$('#sound'),bigwin=$('#bigwin'),bigamount=$('#bigamount'),bigmult=$('#bigmult'),continueBtn=$('#continueBtn');const rnd=a=>a[Math.floor(Math.random()*a.length)],pick=()=>Math.random()<.05?'B':rnd(S),money=n=>'£'+n.toFixed(2),sleep=ms=>new Promise(r=>setTimeout(r,ms));function ensureAudio(){if(!soundOn)return null;if(!audio)audio=new(window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();return audio}function tone(f,d=.08){const a=ensureAudio();if(!a)return;const o=a.createOscillator(),q=a.createGain();o.frequency.value=f;q.gain.value=.03;o.connect(q);q.connect(a.destination);o.start();q.gain.exponentialRampToValueAtTime(.0001,a.currentTime+d);o.stop(a.currentTime+d)}function sfx(n){tone(n==='scatter'?880:n==='win'?660:220,n==='scatter'?.3:n==='win'?.15:.05)}function hud(){bal.textContent=money(balance);betv.textContent=money(wager);fs.textContent=free}function cell(sym,i,drop,mults){const d=document.createElement('div');d.className='cell'+(sym==='B'?' scatter':'')+(drop?' drop':'');if(drop)d.style.setProperty('--d',((i%6)*34)+'ms');if(sym!=='B')d.textContent=sym;if(mults&&mults[i]){const b=document.createElement('span');b.className='badge';b.textContent=mults[i]+'×';d.append(b)}return d}function render(drop=[],wins=[],mults={}){g.innerHTML='';board.forEach((s,i)=>{const d=cell(s,i,drop.includes(i),mults);if(wins.includes(i))d.classList.add('win');g.append(d)})}function getWins(){const x={};board.forEach((s,i)=>{if(s!=='B')(x[s]??=[]).push(i)});return Object.values(x).filter(a=>a.length>=8).flat()}function lock(v){busy=v;spin.disabled=v;down.disabled=v;up.disabled=v}function vanish(a){[...g.children].forEach((e,i)=>{if(a.includes(i))e.classList.add('vanish')})}async function bigWin(total,spinBet){bigamount.textContent=money(total);bigmult.textContent=(total/spinBet).toFixed(1)+'× BET';bigwin.classList.add('show');await new Promise(r=>{continueBtn.onclick=()=>{bigwin.classList.remove('show');r()}})}async function go(){if(busy)return;ensureAudio();if(!free&&balance<wager){msg.textContent="Boab's skint.";return}lock(true);let bonus=free>0,spinBet=wager;if(bonus)free--;else balance-=wager;hud();board=Array.from({length:30},pick);render([...Array(30).keys()]);await sleep(650);let trig=false;async function checkBonus(){if(trig||board.filter(x=>x==='B').length<4)return;trig=true;free+=10;bonus=true;hud();msg.textContent='4 BOABS! +10 FREE SPINS';sfx('scatter');await sleep(700)}await checkBonus();let total=0,t=0;while(true){const wins=getWins();if(!wins.length)break;t++;const base=spinBet*(.18*wins.length+.1*t),mults={};let mt=0;if(bonus)for(let i=0;i<board.length;i++)if(!wins.includes(i)&&board[i]!=='B'&&Math.random()<.05){const m=rnd(M);mults[i]=m;mt+=m}const gain=base*(mt||1);total+=gain;render([],wins,mults);msg.textContent='TUMBLE '+t+' • '+money(gain)+(mt?' • BOAB BOMB '+mt+'×':'');sfx('win');await sleep(500);vanish(wins);await sleep(250);wins.forEach(i=>board[i]=pick());render(wins);await sleep(500);await checkBonus();if(t>=10)break}balance+=total;hud();msg.textContent=total?'BOAB WINS '+money(total)+'!':free?free+' FREE SPINS LEFT':'NAE LUCK.';if(total>=spinBet*20)await bigWin(total,spinBet);lock(false);if(free){await sleep(650);go()}}function resetGame(){if(busy)return;balance=100;wager=1;free=0;board=Array.from({length:30},pick);hud();render([...Array(30).keys()]);msg.textContent="Boab's at the bar. Hit SPIN."}down.onclick=()=>{if(!busy){wager=Math.max(.5,wager-.5);hud()}};up.onclick=()=>{if(!busy){wager=Math.min(5,wager+.5);hud()}};spin.onclick=go;reset.onclick=resetGame;sound.onclick=()=>{soundOn=!soundOn;sound.textContent=soundOn?'🔊':'🔇'};resetGame()})();</script></body></html>
