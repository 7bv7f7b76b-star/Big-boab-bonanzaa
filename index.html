new(window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();return audio}function tone(f,d=.08,t='sine',v=.05,delay=0){const a=ensureAudio();if(!a)return;const o=a.createOscillator(),q=a.createGain(),s=a.currentTime+delay;o.type=t;o.frequency.setValueAtTime(f,s);q.gain.setValueAtTime(.0001,s);q.gain.exponentialRampToValueAtTime(v,s+.012);q.gain.exponentialRampToValueAtTime(.0001,s+d);o.connect(q);q.connect(a.destination);o.start(s);o.stop(s+d+.03)}function sfx(n){if(!soundOn)return;if(n==='tap')tone(180,.04,'square',.025);if(n==='drop'){tone(180,.05,'triangle',.03);tone(270,.04,'triangle',.02,.04)}if(n==='win')[440,554,659,880].forEach((f,i)=>tone(f,.14,'sine',.045,i*.07));if(n==='scatter')[330,440,660,880].forEach((f,i)=>tone(f,.22,'triangle',.06,i*.09));if(n==='bomb'){tone(105,.18,'sawtooth',.055);tone(900,.12,'square',.035,.08)}if(n==='big')[261,329,392,523,659,784,1046].forEach((f,i)=>tone(f,.32,'triangle',.08,i*.11))}function hud(){bal.textContent=money(balance);betv.textContent=money(wager);fs.textContent=free}function cell(sym,i,drop,mults){const d=document.createElement('div');d.className='cell'+(sym==='B'?' scatter':'')+(/^(10|J|Q|K|A)$/.test(sym)?' card':'')+(drop?' drop':'');if(drop)d.style.setProperty('--d',((i%6)*34)+'ms');if(sym==='B'){const im=document.createElement('img');im.src='boab-face.jpg';d.append(im);const l=document.createElement('span');l.className='label';l.textContent='BOAB';d.append(l)}else d.textContent=sym;if(mults&&mults[i]){const b=document.createElement('span');b.className='badge';b.textContent=mults[i]+'×';d.append(b)}return d}function render(drop=[],wins=[],mults={}){g.innerHTML='';board.forEach((s,i)=>{const d=cell(s,i,drop.includes(i),mults);if(wins.includes(i))d.classList.add('win');g.append(d)})}function getWins(){const x={};board.forEach((s,i)=>{if(s!=='B')(x[s]??=[]).push(i)});return Object.values(x).filter(a=>a.length>=8).flat()}function lock(v){busy=v;spin.disabled=v;down.disabled=v;up.disabled=v}function vanish(a){[...g.children].forEach((e,i)=>{if(a.includes(i))e.classList.add('vanish')})}async function bigWin(total,spinBet){bigamount.textContent=money(total);bigmult.textContent=(total/spinBet).toFixed(1).replace('.0','')+'× BET';bigwin.classList.add('show');sfx('big');await new Promise(r=>continueBtn.onclick=()=>{sfx('tap');bigwin.classList.remove('show');r()})}async function go(){if(busy)return;ensureAudio();sfx('tap');if(!free&&balance<wager){msg.textContent="Boab's skint. Reset the demo.";return}lock(true);let bonus=free>0,spinBet=wager;if(bonus)free--;else balance-=wager;hud();msg.textContent=bonus?'FREE SPIN! BOAB IS STILL OOT...':'BOAB IS ON THE MOVE...';board=Array.from({length:30},pick);render([...Array(30).keys()]);sfx('drop');await sleep(720);let triggered=false;async function bonusCheck(){if(triggered||board.filter(x=>x==='B').length<4)return;triggered=true;free+=10;bonus=true;hud();msg.textContent="4 BOABS! +10 FREE SPINS";sfx('scatter');await sleep(1050)}await bonusCheck();let total=0,t=0;while(true){const wins=getWins();if(!wins.length)break;t++;const base=spinBet*(.18*wins.length+.10*t),mults={};let mt=0;if(bonus)for(let i=0;i<board.length;i++)if(!wins.includes(i)&&board[i]!=='B'&&Math.random()<.05){const m=rnd(M);mults[i]=m;mt+=m}const gain=base*(mt||1);total+=gain;render([],wins,mults);msg.textContent='TUMBLE '+t+' • '+money(gain)+(mt?' • BOAB BOMB '+mt+'×':'');mt?sfx('bomb'):sfx('win');await sleep(620);vanish(wins);await sleep(280);wins.forEach(i=>board[i]=pick());render(wins);sfx('drop');await sleep(600);await bonusCheck();if(t>=10)break}balance+=total;hud();msg.textContent=total?'BOAB WINS '+money(total)+'!':free?free+' FREE SPINS LEFT':'NAE LUCK. SPIN AGAIN.';if(total>=spinBet*20)await bigWin(total,spinBet);lock(false);if(free){await sleep(650);go()}}function resetGame(){if(busy)return;balance=100;wager=1;free=0;board=Array.from({length:30},pick);hud();render([...Array(30).keys()]);msg.textContent="Boab's ready. Hit SPIN."}down.onclick=()=>{if(!busy){ensureAudio();sfx('tap');wager=Math.max(.5,wager-.5);hud()}};up.onclick=()=>{if(!busy){ensureAudio();sfx('tap');wager=Math.min(5,wager+.5);hud()}};spin.onclick=go;reset.onclick=resetGame;soundBtn.onclick=()=>{soundOn=!soundOn;soundBtn.textContent=soundOn?'🔊 SOUND ON':'🔇 SOUND OFF';if(soundOn){ensureAudio();sfx('tap')}};resetGame()})();</script></body></html>
