);g.append(d)})}function getWins(){let x={};board.forEach((s,i)=>{if(s!=='B')(x[s]??=[]).push(i)});return Object.values(x).filter(a=>a.length>=8).flat()}function lock(v){busy=v;spin.disabled=v;down.disabled=v;up.disabled=v}async function go(){if(busy)return;if(!free&&balance<wager){msg.textContent="Boab's skint. Reset the demo.";return}lock(true);let bonus=free>0;if(bonus)free--;else balance-=wager;hud();msg.textContent=bonus?'FREE SPIN!':'Boab is on the move...';board=Array.from({length:30},pick);render([...Array(30).keys()]);await sleep(700);let sc=board.filter(x=>x==='B').length;if(sc>=4){free+=10;bonus=true;hud();msg.textContent="BOAB'S BIG NIGHT OOT! +10 FREE SPINS";await sleep(800)}let total=0,t=0;while(true){let w=getWins();if(!w.length||t++>=10)break;let mults={},mt=0;if(bonus)board.forEach((s,i)=>{if(!w.includes(i)&&s!=='B'&&Math.random()<.05){let m=rnd(M);mults[i]=m;mt+=m}});let gain=wager*(.18*w.length+.1*t)*(mt||1);total+=gain;render([],w,mults);msg.textContent='TUMBLE '+t+': '+money(gain)+(mt?' • BOAB BOMB '+mt+'×':'');await sleep(500);let falling=[];for(let col=0;col<6;col++){let survivors=[];for(let row=4;row>=0;row--){let i=row*6+col;if(!w.includes(i))survivors.unshift(board[i])}let missing=5-survivors.length,vals=Array.from({length:missing},pick).concat(survivors);for(let row=0;row<5;row++){let i=row*6+col;board[i]=vals[row];if(row<missing)falling.push(i)}}render(falling);await sleep(650)}balance+=total;hud();msg.textContent=total?'BOAB WINS '+money(total)+'!':free?free+' free spins left.':'Nae luck. Spin again.';lock(false);if(free){await sleep(650);go()}}down.onclick=()=>{if(!busy){wager=Math.max(.5,wager-.5);hud()}};up.onclick=()=>{if(!busy){wager=Math.min(5,wager+.5);hud()}};spin.onclick=go;reset.onclick=()=>{if(!busy){balance=100;wager=1;free=0;board=Array.from({length:30},pick);hud();render();msg.textContent="Boab's ready. Hit SPIN."}};reset.click()})();</script></body></html>
