g)}.controls{max-width:1420px;margin:0 auto;display:grid;grid-template-columns:72px 1.2fr .9fr 92px 92px 1.2fr 72px;gap:10px;align-items:center;background:linear-gradient(#3b2718,#1c120b);border:7px solid #100a06;box-shadow:inset 0 0 0 2px #765032,0 10px 25px #000c;border-radius:12px;padding:8px 12px}.stat{text-align:center;font-family:Arial}.stat span{display:block;color:#d9c4a5;font-size:12px}.stat b{font-size:24px}.btn{border:4px solid #221309;background:linear-gradient(#5c351b,#2b180d);color:#fff;border-radius:9px;padding:12px 8px;font-weight:900}.circle{width:72px;height:72px;border-radius:50%;font-size:28px}.spin{width:86px;height:86px;border-radius:50%;border:7px solid #41200b;background:radial-gradient(circle,#62a844,#285c1f);box-shadow:inset 0 0 0 4px #a9cf75,0 5px 12px #000;color:#fff;font-size:36px}.sound{position:fixed;right:12px;bottom:12px;z-index:20}.overlay{position:fixed;inset:0;background:radial-gradient(circle,#3b1e19ee,#050404f5 72%);display:none;align-items:center;justify-content:center;z-index:50}.overlay.show{display:flex}.winbox{text-align:center;padding:30px}.winTitle{font:900 clamp(68px,13vw,145px)/.8 Impact,Arial;color:#f2c144;text-shadow:0 6px #7a3413,0 12px #1b0b04}.winAmount{font:900 clamp(48px,9vw,90px) Arial;color:#7fe48a}.continue{margin-top:18px;border:0;border-radius:30px;padding:13px 24px;font-weight:900;font-size:18px}.coins{position:absolute;inset:0;pointer-events:none;overflow:hidden}.coin{position:absolute;top:-10vh;animation:fall var(--dur) linear infinite;animation-delay:var(--delay);left:var(--left);font-size:30px}@keyframes fall{to{transform:translateY(120vh) rotate(760deg)}}@media(max-width:1050px){.scene{padding:10px 7px 90px}.top{grid-template-columns:100px 1fr 140px;gap:7px}.hero{width:92px;height:122px;border-width:4px}.club{display:none}.bonusBoard{font-size:13px;border-width:4px;padding:9px 5px}.radio{display:none}.logoTop{font-size:44px}.logoMid{font-size:41px}.logoBand{font-size:26px;padding:2px 12px}.machine{marg class="winbox"><div class="winTitle">BIG BOAB!</div><div id="bigamount" class="winAmount">£0.00</div><div id="bigmult" style="font:900 27px Arial;color:#f6d992">20× BET</div><button id="continueBtn" class="continue">GET BACK TO IT</button></div></div><script>(()=>{'use strict';const S=['10','J','Q','K','A','🥃','🍺','🎒','🏰','🐕'],M=[2,3,5,10,25,50,100];let balance=100,wager=1,free=0,busy=false,board=[],soundOn=true,audio=null;const g=document.querySelector('#grid'),msg=document.querySelector('#msg'),spin=document.querySelector('#spin');const rnd=a=>a[Math.floor(Math.random()*a.length)],pick=()=>Math.random()<.055?'B':rnd(S),money=n=>'£'+n.toFixed(2),sleep=ms=>new Promise(r=>setTimeout(r,ms));function ensureAudio(){if(!soundOn)return null;if(!audio)audio=new(window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();return audio}function tone(f,d=.08,t='sine',v=.05,delay=0){const a=ensureAudio();if(!a)return;const o=a.createOscillator(),q=a.createGain(),s=a.currentTime+delay;o.type=t;o.frequency.setValueAtTime(f,s);q.gain.setValueAtTime(.0001,s);q.gain.exponentialRampToValueAtTime(v,s+.012);q.gain.exponentialRampToValueAtTime(.0001,s+d);o.connect(q);q.connect(a.destination);o.start(s);o.stop(s+d+.03)}function sfx(n){if(!soundOn)return;if(n==='tap')tone(170,.04,'square',.025);if(n==='drop'){tone(175,.05,'triangle',.03);tone(250,.04,'triangle',.02,.04)}if(n==='win')[392,494,587,784].forEach((f,i)=>tone(f,.14,'sine',.045,i*.07));if(n==='scatter')[294,392,587,784].forEach((f,i)=>tone(f,.22,'triangle',.06,i*.09));if(n==='bomb'){tone(100,.18,'sawtooth',.055);tone(820,.12,'square',.035,.08)}if(n==='big')[247,294,370,494,587,740,988].forEach((f,i)=>tone(f,.32,'triangle',.08,i*.11))}function hud(){bal.textContent=money(balance);betv.textContent=money(wager);fs.textContent=free}function cell(sym,i,drop,mults){const d=document.createElement('div');d.className='cell'+(sym==='B'?' scatter':'')+(/^(10|J|Q|K|A)$/.test(sym)?' card':'')+(drop?' drop':' n;triggered=true;free+=10;bonus=true;hud();msg.textContent="4 BOABS! +10 FREE SPINS";sfx('scatter');await sleep(950)}await bonusCheck();let total=0,t=0;while(true){const wins=getWins();if(!wins.length)break;t++;const base=spinBet*(.24*wins.length+.12*t),mults={};let mt=0;if(bonus)for(let i=0;i<board.length;i++)if(!wins.includes(i)&&board[i]!=='B'&&Math.random()<.055){const m=rnd(M);mults[i]=m;mt+=m}const gain=base*(mt||1);total+=gain;render([],wins,mults);msg.textContent='TUMBLE '+t+' • '+money(gain)+(mt?' • BOAB BOMB '+mt+'×':'');mt?sfx('bomb'):sfx('win');await sleep(600);vanish(wins);await sleep(260);wins.forEach(i=>board[i]=pick());render(wins);sfx('drop');await sleep(560);await bonusCheck();if(t>=10)break}balance+=total;hud();msg.textContent=total?'BOAB WINS '+money(total)+'!':free?free+' FREE SPINS LEFT':'NAE LUCK. SPIN AGAIN.';if(total>=spinBet*20)await bigWin(total,spinBet);lock(false);if(free){await sleep(650);go()}}function resetGame(){if(busy)return;balance=100;wager=1;free=0;board=Array.from({length:20},pick);hud();render([...Array(20).keys()]);msg.textContent="Boab's ready. Hit SPIN."}down.onclick=()=>{if(!busy){ensureAudio();sfx('tap');wager=Math.max(.5,wager-.5);hud()}};up.onclick=()=>{if(!busy){ensureAudio();sfx('tap');wager=Math.min(5,wager+.5);hud()}};spin.onclick=go;reset.onclick=resetGame;soundBtn.onclick=()=>{soundOn=!soundOn;soundBtn.textContent=soundOn?'🔊 SOUND ON':'🔇 SOUND OFF';if(soundOn){ensureAudio();sfx('tap')}};resetGame()})();</script></body></html>
